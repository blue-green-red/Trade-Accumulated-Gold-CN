# Load in exactly one HTTP owner: the existing Nginx OR gold-http.d for standalone mode.
server {
    listen 80;
    server_name gold.goalgoal.fun;
    if ($host != gold.goalgoal.fun) { return 444; }

    # HTTP-01 must stay reachable without dashboard authentication.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/gold-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://gold.goalgoal.fun$request_uri;
    }
}
