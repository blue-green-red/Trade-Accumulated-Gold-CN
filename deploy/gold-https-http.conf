# Bootstrap only: replace with gold-https.conf after Certbot issues the certificate.
# This separate Nginx instance does not load other sites-enabled configurations.
user www-data;
worker_processes 1;
pid /run/gold-https.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    server {
        listen 80;
        server_name gold.goalgoal.fun;
        if ($host != gold.goalgoal.fun) { return 444; }

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/gold-acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://gold.goalgoal.fun$request_uri;
        }
    }
}
