# Independent instance: keep existing, inactive Nginx sites untouched.
user www-data;
worker_processes 1;
pid /run/gold-https.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    server {
        listen 80;
        server_name gold.goalgoal.fun;
        if ($host != gold.goalgoal.fun) { return 444; }

        # Must remain reachable on port 80 for unattended HTTP-01 renewals.
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/gold-acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://gold.goalgoal.fun$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name gold.goalgoal.fun;
        if ($host != gold.goalgoal.fun) { return 444; }

        ssl_certificate /etc/letsencrypt/live/gold.goalgoal.fun/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gold.goalgoal.fun/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_session_cache shared:goldTLS:1m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_buffer_size 4k;
        client_max_body_size 16k;

        location / {
            proxy_pass http://127.0.0.1:18080;
            # Preserve the browser authority for the backend's Origin check.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            # Preserve backend authentication, ETags and private cache policies.
            proxy_cache off;
        }
    }
}
